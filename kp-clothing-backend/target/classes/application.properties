spring.application.name=kp-clothing-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kpclothing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=5000

# File Upload Limits (60MB as requested)
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB

# Disable default security password generation
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# AWS S3 (Environment variable bindings)
aws.s3.bucket=${AWS_S3_BUCKET:kp-clothing-photos-2026}
aws.s3.region=${AWS_S3_REGION:us-east-1}

# Razorpay (Optional - if provided via env)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Security & Secrets
jwt.secret=${JWT_SECRET:kpClothing2026SecretKeyForJWTSigningMustBeAtLeast32CharsLong}
jwt.expiration.ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:*,http://127.0.0.1:*,https://www.kp-clothing.shop,https://kp-clothing.shop}

# Safe Error Reporting in Production (never leak internal stack traces)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never